[project]
name = "licensing-lab"
version = "0.1.0"
description = "Whose code is it anyway? Eight licensing mistakes in one small open-source project."
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["cases", "tests/solutions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
